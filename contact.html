<!DOCTYPE html>
<html lang="en">

<head>
    <title>StreetTrack</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="apple-touch-icon" href="assets/img/apple-icon.png">
    <link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon.ico">
    <!-- Load Require CSS -->
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font CSS -->
    <link href="assets/css/boxicon.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Load Tempalte CSS -->
    <link rel="stylesheet" href="assets/css/templatemo.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/custom.css">

</head>

    <style>
html, body {
  height: 100%;
  margin: 0;
}

.page-wrapper {
  min-height: 100%;
  display: flex;
  flex-direction: column;
}

main {
  flex: 1; /* this pushes footer to bottom */
}        
    </style>

<body>
<div class="page-wrapper">
    
   <!-- Header -->
    <nav id="main_nav" class="navbar navbar-expand-lg navbar-light bg-white shadow">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand h1" href="/">
                <img src="logo.png" alt="StreetTrack Logo" width="40%" />
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-toggler-success" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="align-self-center collapse navbar-collapse flex-fill  d-lg-flex justify-content-lg-between" id="navbar-toggler-success">
                <div class="flex-fill mx-xl-5 mb-2">
                    <ul class="nav navbar-nav d-flex justify-content-between mx-xl-5 text-center text-dark">

                        <li class="nav-item">
                            <a class="nav-link btn-outline-primary rounded-pill px-3" href="brand">Our Brand</a>
                        </li>
                        
                         <li class="nav-item">
                            <a class="nav-link btn-outline-primary rounded-pill px-3" href="products">Our Products</a>
                         </li>                
                       
                        <li class="nav-item">
                            <a class="nav-link btn-outline-primary rounded-pill px-3" href="contact">Contact Us</a>
                        </li>
                    </ul>
                </div>
               
            </div>
        </div>
    </nav>
    <!-- Close Header -->


 <main>


    <!-- Start Contact -->
    <section class="container py-5">

        <h1 class="col-12 col-xl-8 h2 text-left text-primary pt-3">Contact Us</h1>
        <h2 class="col-12 col-xl-8 h4 text-left regular-400"></h2>
        <h2 class="col-12 col-xl-8 h4 text-left regular-400"></h2>
        <BR>


            <!-- Start Contact Form -->
            <div class="col-lg-8 ">
                <form class="contact-form row" method="POST" action="https://api.web3forms.com/submit">
    <input type="hidden" name="access_key" value="13ea9574-6353-45c1-84ca-58425bb85c02">
<input type="hidden" name="redirect" value="https://streettrack.net/thank-you">

    <div class="col-lg-6 mb-4">
        <div class="form-floating">
            <input type="text" class="form-control form-control-lg light-300" id="floatingname" name="name" placeholder="Name">
            <label for="floatingname light-300">Name</label>
        </div>
    </div>

    <div class="col-lg-6 mb-4">
        <div class="form-floating">
            <input type="email" class="form-control form-control-lg light-300" id="floatingemail" name="email" placeholder="Email" required>
            <label for="floatingemail light-300">Email</label>
        </div>
    </div>

    <div class="col-lg-6 mb-4">
        <div class="form-floating">
            <input type="text" class="form-control form-control-lg light-300" id="floatingphone" name="phone" placeholder="Phone">
            <label for="floatingphone light-300">Phone</label>
        </div>
    </div>

    <div class="col-lg-6 mb-4">
        <div class="form-floating">
            <input type="text" class="form-control form-control-lg light-300" id="floatingcompany" name="company" placeholder="Company Name">
            <label for="floatingcompany light-300">Company Name</label>
        </div>
    </div>

    <div class="col-12">
        <div class="form-floating mb-4">
            <input type="text" class="form-control form-control-lg light-300" id="floatingsubject" name="subject" placeholder="Subject">
            <label for="floatingsubject light-300">Subject</label>
        </div>
    </div>

    <div class="col-12">
        <div class="form-floating mb-3">
            <textarea class="form-control light-300" rows="8" placeholder="Message" id="floatingtextarea" name="message"></textarea>
            <label for="floatingtextarea light-300">Message</label>
        </div>
    </div>

    <div class="col-md-12 col-12 m-auto text-end">
        <button type="submit" class="btn btn-secondary rounded-pill px-md-5 px-4 py-2 radius-0 text-light light-300">Send Message</button>
    </div>
</form>
            </div>
            <!-- End Contact Form -->


        </div>
    </section>
    <!-- End Contact -->

</main>
    <!-- Start Footer -->
    <footer>
       
        <div class="w-100 bg-primary py-3">
            <div class="container">
                <div class="row pt-2">
                    <div class="col-lg-6 col-sm-12">
                        <p class="text-lg-start text-center text-light light-300">
                            © Copyright 2025 StreetTrack LLC.
                        </p>
                    </div>
                   
                </div>
            </div>
        </div>

    </footer>
    <!-- End Footer -->


    <!-- Bootstrap -->
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <!-- Templatemo -->
    <script src="assets/js/templatemo.js"></script>
    <!-- Custom -->
    <script src="assets/js/custom.js"></script>

    </div>
</body>

</html>
