<div id="product-container">Loading product...</div>

<script>
// Get ?part=PARAM from URL
const params = new URLSearchParams(window.location.search);
const partNum = params.get("part");

// Load product database page
fetch("products-data.html")
  .then(r => r.text())
  .then(html => {
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, "text/html");
    const json = JSON.parse(doc.getElementById("products-json").textContent);

    const product = json.products.find(p => p.part === partNum);

    const container = document.getElementById("product-container");

    if (!product) {
      container.innerHTML = `<p>Product not found.</p>`;
      return;
    }

    container.innerHTML = `
      <div class="product">
          <div style="width:50%; display: inline-block;"><img src="${product.img}" alt="${product.name}"></div>
          <div style="width:50%; display: inline-block;">
            <h2>${product.name}</h2>
            <BR>
            <p><strong>Part #: ${product.part}</strong></p>
            <p>${product.description}</p>
          </div>
      </div>
    `;
  });
</script>
