<!DOCTYPE html>
<html>
<head>
<title>StreetTrack</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="apple-touch-icon" href="assets/img/apple-icon.png">
    <link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon.ico">
    <!-- Load Require CSS -->
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font CSS -->
    <link href="assets/css/boxicon.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Load Tempalte CSS -->
    <link rel="stylesheet" href="assets/css/templatemo.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/custom.css">
<style>
html, body {
  height: 100%;
  margin: 0;
}

.page-wrapper {
  min-height: 100%;
  display: flex;
  flex-direction: column;
}

main {
  flex: 1; /* this pushes footer to bottom */
}
    
.product {
  display: flex;
  gap: 10px;
  max-width: 80%;
  border: 1px solid #ddd;
  padding: 25px;
  margin-top: 50px;
  margin-left: 10%;
  margin-right: 10%;
  margin-bottom: 50px;
  border-radius: 8px;
  font-family: Arial, sans-serif;
}
.product img { width: 100%; max-width: 500px; border-radius: 6px; margin-bottom: 10px; }
</style>
</head>

    <body>
        <div class="page-wrapper">

    <!-- Header -->
    <nav id="main_nav" class="navbar navbar-expand-lg navbar-light bg-white shadow">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="navbar-brand h1" href="/">
                <img src="logo.png" alt="StreetTrack Logo" width="40%" />
            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-toggler-success" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="align-self-center collapse navbar-collapse flex-fill  d-lg-flex justify-content-lg-between" id="navbar-toggler-success">
                <div class="flex-fill mx-xl-5 mb-2">
                    <ul class="nav navbar-nav d-flex justify-content-between mx-xl-5 text-center text-dark">

                        <li class="nav-item">
                            <a class="nav-link btn-outline-primary rounded-pill px-3" href="brand">Our Brand</a>
                        </li>
                        
                         <li class="nav-item">
                            <a class="nav-link btn-outline-primary rounded-pill px-3" href="products">Our Products</a>
                         </li>                
                       
                        <li class="nav-item">
                            <a class="nav-link btn-outline-primary rounded-pill px-3" href="contact">Contact Us</a>
                        </li>
                    </ul>
                </div>
                <!-- 
                <div class="navbar align-self-center d-flex">
                    <a class="nav-link" href="#"><i class='bx bx-bell bx-sm bx-tada-hover text-primary'></i></a>
                    <a class="nav-link" href="#"><i class='bx bx-cog bx-sm text-primary'></i></a>
                    <a class="nav-link" href="#"><i class='bx bx-user-circle bx-sm text-primary'></i></a>
                </div> -->
            </div>
        </div>
    </nav>
    <!-- Close Header -->


<div id="product-container">Loading product...</div>

<script>
// Get ?part=PARAM from URL
const params = new URLSearchParams(window.location.search);
const partNum = params.get("part");

// Load product database page
fetch("products-data.html")
  .then(r => r.text())
  .then(html => {
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, "text/html");
    const json = JSON.parse(doc.getElementById("products-json").textContent);

    const product = json.products.find(p => p.part === partNum);

    const container = document.getElementById("product-container");

    if (!product) {
      container.innerHTML = `<p>Product not found.</p>`;
      return;
    }

    container.innerHTML = `
      <div class="product">
          <div style="width:50%; display: inline-block;"><img src="${product.img}" alt="${product.name}"></div>
          <div style="width:50%; display: inline-block;">
            <h2>${product.name}</h2>
            <BR>
            <p><strong>Part #: ${product.part}</strong></p>
            <p>${product.description}</p>
          </div>
      </div>
    `;
  });
</script>
 <!-- Start Footer -->
    <footer>        

        <div class="w-100 bg-primary py-3">
            <div class="container">
                <div class="row pt-2">
                    <div class="col-lg-6 col-sm-12">
                        <p class="text-lg-start text-center text-light light-300">
                            © Copyright 2025 StreetTrack LLC
                        </p>
                    </div>
                    
            </div>
        </div>
            </div>

    </footer>
    <!-- End Footer -->
     </div>
</body>    
 <!-- Bootstrap -->
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <!-- Templatemo -->
    <script src="assets/js/templatemo.js"></script>
    <!-- Custom -->
    <script src="assets/js/custom.js"></script>
    
</html>
