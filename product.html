<!DOCTYPE html>
<html>
<head>
<title>Product Page</title>
<style>
.product {
  max-width: 500px;
  border: 1px solid #ddd;
  padding: 15px;
  margin-top: 20px;
  border-radius: 8px;
  font-family: Arial, sans-serif;
}
.product img { max-width: 100%; border-radius: 6px; margin-bottom: 10px; }
</style>
</head>

<body>
<div id="product-container">Loading product...</div>

<script>
// Get ?part=PARAM from URL
const params = new URLSearchParams(window.location.search);
const partNum = params.get("part");

// Load product database page
fetch("products-data.html")
  .then(r => r.text())
  .then(html => {
    const parser = new DOMParser();
    const doc = parser.parseFromString(html, "text/html");
    const json = JSON.parse(doc.getElementById("products-json").textContent);

    const product = json.products.find(p => p.part === partNum);

    const container = document.getElementById("product-container");

    if (!product) {
      container.innerHTML = `<p>Product not found.</p>`;
      return;
    }

    container.innerHTML = `
      <div class="product">
        <h2>${product.name}</h2>
        <img src="${product.img}" alt="${product.name}">
        <p><strong>Part #:</strong> ${product.part}</p>
       
        <p>${product.description}</p>
      </div>
    `;
  });
</script>

</body>
</html>
