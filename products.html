<!DOCTYPE html>
<html lang="en">

<head>
    <title>StreetTrack</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="apple-touch-icon" href="assets/img/apple-icon.png">
    <link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon.ico">
    <!-- Load Require CSS -->
    <link href="assets/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font CSS -->
    <link href="assets/css/boxicon.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet">
    <!-- Load Tempalte CSS -->

    <style>
      /* Product grid container */
.projects {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 2rem; /* uniform gap horizontally & vertically */
  margin-top: 2rem;
  margin-bottom: 2rem;
}

/* Individual product cards */
.service-work.card {
  border: 1px solid #ddd;
  border-radius: 1rem;
  overflow: hidden;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  background-color: #fff;
  width: 100%;
  max-width: 360px;
  padding: 1rem;
  box-sizing: border-box;
  margin-bottom: 2rem; /* extra bottom margin to prevent row collisions */
}

/* Hover effect */
.service-work.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.1);
}

/* Uniform image area */
.service-work.card img.card-img-top {
  width: 100%;
  height: 220px;
  object-fit: contain;
  padding: 10px;
  background-color: #f8f8f8;
  border-bottom: 1px solid #eee;
}

/* Body area spacing */
.service-work .card-body {
  padding: 1rem 0;
  min-height: 140px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  text-align: center;
}

/* Title */
.service-work .card-title {
  font-size: 1.05rem;
  font-weight: 600;
  margin-bottom: 0.75rem;
  min-height: 3rem;
}

/* Part number text */
.service-work .text-primary.light-300 {
  font-size: 0.95rem;
  font-weight: 500;
}
    </style>
</head>

   

<body>
    <!-- Header -->
    <nav id="main_nav" class="navbar navbar-expand-lg navbar-light bg-white shadow">

            </a>
            <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-toggler-success" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">

                        <li class="nav-item">

                        </li>
                        
                         <li class="nav-item">
                            <a class="nav-link btn-outline-primary rounded-pill px-3" href="products">Our Products</a>
                         </li>                
                       
                        <li class="nav-item">
                            <a class="nav-link btn-outline-primary rounded-pill px-3" href="contact">Contact Us</a>

                </div>
                <!-- 
                <div class="navbar align-self-center d-flex">
                    <a class="nav-link" href="#"><i class='bx bx-bell bx-sm bx-tada-hover text-primary'></i></a>
                    <a class="nav-link" href="#"><i class='bx bx-cog bx-sm text-primary'></i></a>

                </div> -->
            </div>
        </div>

    <!-- Close Header -->


    

    <!-- Start Our Work -->
    <section class="container py-5">
        <div class="row justify-content-center my-5">
            <div class="filter-btns shadow-md rounded-pill text-center col-auto">
                <a class="filter-btn btn rounded-pill btn-outline-primary border-0 m-md-2 px-md-4 active" data-filter=".project" href="#">All</a>
                <a class="filter-btn btn rounded-pill btn-outline-primary border-0 m-md-2 px-md-4" data-filter=".drivetrain" href="#">Drivetrain</a>
                <a class="filter-btn btn rounded-pill btn-outline-primary border-0 m-md-2 px-md-4" data-filter=".steering" href="#">Steering</a>
                <a class="filter-btn btn rounded-pill btn-outline-primary border-0 m-md-2 px-md-4" data-filter=".suspension" href="#">Suspension</a>

        </div>

       <div class="row projects gx-lg-5" id="product-grid">
    <!-- Products will load here dynamically -->
</div>

    <!-- Start Footer -->
    <footer>
       
        <div class="w-100 bg-primary py-3">
            <div class="container">
                <div class="row pt-2">
                    <div class="col-lg-6 col-sm-12">
                        <p class="text-lg-start text-center text-light light-300">
                            © Copyright 2025 StreetTrack LLC.
                        </p>
                    </div>
                   
                </div>
            </div>
        </div>

    </footer>
    <!-- End Footer -->


   <!-- Bootstrap -->
    <script src="assets/js/bootstrap.bundle.min.js"></script>
    <!-- Lightbox -->
    <script src="assets/js/fslightbox.js"></script>
    <script>
        fsLightboxInstances['gallery'].props.loadOnlyCurrentSource = true;
    </script>
    <!-- Load jQuery require for isotope -->
    <script src="assets/js/jquery.min.js"></script>
    <!-- Isotope -->
    <script src="assets/js/isotope.pkgd.js"></script>
    <!-- Page Script -->
    <script>
        $(window).load(function() {
            // init Isotope
            var $projects = $('.projects').isotope({
                itemSelector: '.project',
                layoutMode: 'fitRows'
            });
            $(".filter-btn").click(function() {
                var data_filter = $(this).attr("data-filter");
                $projects.isotope({
                    filter: data_filter
                });
                $(".filter-btn").removeClass("active");
                $(".filter-btn").removeClass("shadow");
                $(this).addClass("active");
                $(this).addClass("shadow");
                return false;
            });
        });
    </script>
    <!-- Templatemo -->
    <script src="assets/js/templatemo.js"></script>
    <!-- Custom -->
    <script src="assets/js/custom.js"></script>

  <script>
document.addEventListener("DOMContentLoaded", function () {
    const params = new URLSearchParams(window.location.search);
    const filterParam = params.get("filter");
    if (filterParam) {
        const selector = filterParam === "all" ? "*" : "." + filterParam;
        setTimeout(() => {
            $('.projects').isotope({ filter: selector });
            $(".filter-btn").removeClass("active shadow");
            $(`.filter-btn[data-filter="${selector}"]`).addClass("active shadow");
        }, 500);
    }
});
</script>

  <script>
document.addEventListener("DOMContentLoaded", async function () {
    const productGrid = document.querySelector(".projects");
    const dbUrl = "products-data.html"; // path to your JSON database page

    try {
        const response = await fetch(dbUrl);
        const text = await response.text();

        // Extract JSON content from <script id="products-json">
        const jsonMatch = text.match(/<script id="products-json"[^>]*>([\s\S]*?)<\/script>/);
        if (!jsonMatch) throw new Error("No product data found");
        const data = JSON.parse(jsonMatch[1]);
        const products = data.products;

        // Populate product cards
        productGrid.innerHTML = "";
        products.forEach(prod => {
            const card = document.createElement("a");
            card.href = `product.html?part=${prod.part}`;
            card.className = `col-sm-6 col-lg-4 text-decoration-none project ${prod.category}`;
            card.innerHTML = `
                <div class="service-work overflow-hidden card mb-5 mx-5 m-sm-0">
                    <img class="card-img-top" src="${prod.img}" alt="${prod.name}">
                    <div class="card-body">
                        <h5 class="card-title light-300 text-dark">${prod.name}</h5>
                        <span class="text-decoration-none text-primary light-300">
                            Part# ${prod.part}
                        </span>
                    </div>
                </div>
            `;
            productGrid.appendChild(card);
        });

        // Initialize Isotope filtering after cards are loaded
        const $projects = $('.projects').isotope({
            itemSelector: '.project',
            layoutMode: 'fitRows'
        });

        $(".filter-btn").click(function() {
            const data_filter = $(this).attr("data-filter");
            $projects.isotope({ filter: data_filter });
            $(".filter-btn").removeClass("active shadow");
            $(this).addClass("active shadow");
            return false;
        });

    } catch (err) {
        console.error("Error loading product data:", err);
        productGrid.innerHTML = "<p class='text-danger'>Failed to load products.</p>";
    }
});
</script>  

</body>

</html>
